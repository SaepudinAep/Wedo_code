    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body { font-family: 'Nunito', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 12px; }

        .state-flag { font-size: 10px; font-weight: bold; color: #2980b9; background: #ebf5fb; padding: 3px 8px; border-radius: 6px; margin-top: 5px; display: none; }

        .button-row { display: flex; gap: 6px; margin-top: 8px; }
        .button-row button { flex: 1; padding: 6px; font-size: 11px; margin: 0; }

        .empty-state { color: #b2bec3; text-align: center; padding: 25px; border: 2px dashed var(--border-soft); border-radius: 12px; font-weight: bold; font-size: 13px; background: #fafbfc; grid-column: 1 / -1; }

<body>

<div class="wrapper">
    <div class="top-actions">
        <h1>🐼 RoboPanda Unified Control v40.6</h1>
        <div class="status-dots" id="globalStatusDots"><span class="status-dots-empty">Belum ada hub</span></div>
        <button class="btn-green" id="btnConnect">+ Hubungkan Hub</button>
    </div>

    <!-- PANEL PUSAT KONTROL MISI -->
    <div class="card">
        <h2>📋 Global Mission Builder & Command Center</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:8px; background:#f8fafc; border-radius:8px; flex-wrap:wrap; gap:6px;">
            <div style="font-size:11px; font-weight:bold; display:flex; gap:6px; align-items:center;">
                <span>Warna LED Global:</span>
                <input type="color" id="global-color" value="#9966FF" style="width:25px; height:25px; border:none; cursor:pointer;" onchange="setGlobalColor()">
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn-warning" style="padding:6px 12px; font-size:11px;" onclick="broadcastMission()">🚀 JALANKAN SEMUA READY</button>
                <button class="btn-red" style="padding:6px 12px; font-size:11px;" onclick="stopAllMissions()">🛑 STOP SEMUA MISI</button>
            </div>
        </div>
        <div id="mission-builder-container"></div>
    </div>

    <!-- CONTAINER KARTU ROBOT/HUB -->
    <div id="hubsContainer">
        <div class="empty-state" id="emptyState">Belum ada hub. Klik "+ Hubungkan Hub" untuk mulai (maks. 4 hub).</div>
    </div>

    <div class="button-row">
        <button class="btn-primary" onclick="copyLogs()">Salin Log</button>
        <button class="btn-red" onclick="clearLogs()">Bersihkan Log</button>
    </div>
    <div class="log-box" id="systemLog">[SYSTEM v40.6] Rate Limit 10/detik + KeepAlive 200ms + Protokol Resmi Aktif...</div>
</div>

<script>
    window.AppState = { robots: [] };

    // Palet warna tetap per-hub, dipakai untuk border kartu & status dot agar mudah
    // dicocokkan dengan stiker warna fisik di badan robot. Maks. 4 hub.
    const HUB_COLORS = ['#0984e3', '#00b894', '#fdcb6e', '#e84393'];

    // ================== KONFIGURASI KALIBRASI TILT SENSOR ==================
    // Kalau arah kiri/kanan/depan/belakang terbalik setelah tes di hardware,
    // cukup ubah invertX / invertY di sini, TIDAK perlu ubah logic snapTiltValue.
    const TiltConfig = {
        deadZoneDeg: 12,   // Sesuaikan hasil tes fisik (kalau terlalu sensitif, naikkan; kalau kurang responsif, turunkan)
        invertX: false,
        invertY: false
    };

    window.GlobalMission = {
        type: 'm1',
        m2Loop: false,
        m5TriggerPort: 'A',
        m5SensorType: 'distance',
        m5Operator: '<',
        m5TriggerVal: 5,
        isExecuting: false,
        defaultActions: [{ port: 'A', direction: 1, speed: 100 }],

        // --- Setiap mode sekarang punya array/objek SENDIRI dengan bentuk data konsisten. ---
        // Ini memperbaiki bug lama: dulu m2/m3/m4 berbagi 1 array "rows" dengan bentuk
        // objek berbeda-beda, sehingga pindah dropdown mission setelah menambah baris
        // di satu mode bisa bikin render mode lain crash (field yang dibaca undefined).
        m1Row: { actions: [{ port: 'A', direction: 1, speed: 100 }] },

        m2Rows: [
            { time: 2, actions: [{ port: 'A', direction: 1, speed: 100 }] }
        ],

        m3Rows: [
            {
                sensorPort: 'A',
                sensorType: 'distance',
                operator: '<',
                threshold: 5,
                steps: [{ time: 2, actions: [{ port: 'A', direction: 1, speed: 100 }] }]
            }
        ],

        m4Rows: [
            { sensorPort: 'A', sensorType: 'tilt', operator: '==', threshold: 0, actions: [{ port: 'A', direction: 1, speed: 100 }] }
        ],

        states: [
            { actions: [{ port: 'A', direction: 1, speed: 100 }] },
            { actions: [{ port: 'A', direction: 0, speed: 0 }] }
        ]
    };

    const BLEService = {
        DEVICE_SERVICE: '00001523-1212-efde-1523-785feabcd123',
        IO_SERVICE: '00004f0e-1212-efde-1523-785feabcd123'
    };

    const BLECharacteristic = {
        ATTACHED_IO: '00001527-1212-efde-1523-785feabcd123',
        INPUT_VALUES: '00001560-1212-efde-1523-785feabcd123',
        INPUT_COMMAND: '00001563-1212-efde-1523-785feabcd123',
        OUTPUT_COMMAND: '00001565-1212-efde-1523-785feabcd123',
        BUTTON_STATE: '00001526-1212-efde-1523-785feabcd123'
    };

    const WeDo2Device = { MOTOR: 1, TILT: 34, DISTANCE: 35, LED: 23 };
    const WeDo2ConnectID = { LED: 6 };
    const WeDo2Command = { MOTOR_POWER: 1, WRITE_RGB: 4 };
    const WeDo2Mode = { TILT: 0, DISTANCE: 0, LED: 1 };
    const WeDo2Unit = { TILT: 0, DISTANCE: 1, LED: 0 };
    const MAX_HUBS = 4;

    // Maksimal perintah BLE (writeValue) yang boleh terkirim per detik, PER HUB.
    // Meniru BLESendRateMax di ekstensi resmi (di sana defaultnya 20/detik) -- di
    // sini sengaja lebih ketat (10/detik) sesuai permintaan, supaya hub yang lebih
    // "rewel" (mis. robopanda D) tidak kebanjiran perintah beruntun.
    const BLESendRateMax = 10;

    // Rate limiter sederhana (rolling 1 detik) -- satu instance per hub, dipasang
    // di constructor NativeWeDo2Engine. Kalau limit terlampaui, perintah BARU
    // dilewati (drop), bukan diantre menumpuk -- persis perilaku resmi.
    class RateLimiter {
        constructor (maxCallsPerSecond) {
            this.maxCallsPerSecond = maxCallsPerSecond;
            this._timestamps = [];
        }
        okayToSend () {
            const now = Date.now();
            while (this._timestamps.length && now - this._timestamps[0] > 1000) {
                this._timestamps.shift();
            }
            if (this._timestamps.length < this.maxCallsPerSecond) {
                this._timestamps.push(now);
                return true;
            }
            return false;
        }
    }

    window.getPlayableEntities = function() {
        return AppState.robots.map(r => ({ id: r.id, name: r.name, hub1: r.id, hub2: null }));
    };

    window.hexToRgb = function(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        if (result) {
            return { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) };
        }
        return { r: 153, g: 102, b: 255 };
    };

    // ================== TILT SENSOR: UNWRAP + SNAP (DIPERBAIKI) ==================
    // Berdasarkan protokol resmi WeDo 2.0 (referensi scratch-vm): raw byte tilt X/Y
    // (0-255) sebenarnya adalah signed byte yang di-wrap, bukan skala linear
    // dengan titik tengah 128. Nilai > 127 berarti sudut negatif: byteVal - 256.
    // Versi lama fungsi ini TIDAK melakukan unwrap ini, sehingga sudut kecil negatif
    // (misal raw 250 = -6 derajat) terbaca seolah penyimpangan besar (250) -> salah baca.
    function unwrapSignedByte(byteVal) {
        if (byteVal === undefined || byteVal === null) return 0;
        return byteVal > 127 ? byteVal - 256 : byteVal;
    }

    // Output kode HARUS singkron dengan getTiltSelectorOptions():
    // 0=Datar, 3=Belakang, 5=Depan, 7=Kanan, 9=Kiri
    // (versi lama tertukar: menghasilkan 5=Kanan/9=Kiri/3=Depan/7=Belakang - beda dengan label UI)
    function snapTiltValue(rawX, rawY) {
        let angleX = unwrapSignedByte(rawX);
        let angleY = unwrapSignedByte(rawY);
        if (TiltConfig.invertX) angleX = -angleX;
        if (TiltConfig.invertY) angleY = -angleY;

        if (Math.abs(angleX) <= TiltConfig.deadZoneDeg && Math.abs(angleY) <= TiltConfig.deadZoneDeg) {
            return 0; // Datar / Netral
        }

        if (Math.abs(angleX) > Math.abs(angleY)) {
            return angleX > 0 ? 7 : 9; // 7 = Kanan, 9 = Kiri
        } else {
            return angleY > 0 ? 5 : 3; // 5 = Depan, 3 = Belakang
        }
    }

    // Skala mentah sensor IR/distance WeDo 2.0 clone kamu: 0-100, dropdown
    // ambang batas ditampilkan per kelipatan 10 (0,10,20,...,100) untuk
    // kemudahan pemilihan, sementara getSensorVal tetap boleh membaca nilai
    // presisi penuh 0-100 (tidak ikut dibulatkan ke kelipatan 10).
    const DistanceConfig = { maxRaw: 100, step: 10 };

    window.getSensorVal = function(hubId, portChar, sType) {
        var pNum = (portChar === 'A' || portChar === 'C') ? 1 : 2;
        var div = document.getElementById('port' + pNum + 'Val-' + hubId.replace('hub_', ''));

        if (!div || div.innerText === '--' || div.innerText.trim() === '') {
            return sType === 'distance' ? DistanceConfig.maxRaw : 0;
        }
        var val = parseFloat(div.innerText);
        if (isNaN(val)) return sType === 'distance' ? DistanceConfig.maxRaw : 0;

        if (sType === 'distance') {
            if (val > DistanceConfig.maxRaw) val = DistanceConfig.maxRaw;
            if (val < 0) val = 0;
        }
        return val;
    };

    // ================== MOTOR PORT -- MENIRU PERSIS WeDo2Motor RESMI ==================
    // Dulu perintah motor dibangun manual inline (rumus scaling + array byte ad-hoc).
    // Sekarang power & direction dipisah, mengikuti pola resmi scratch-vm, dan SEMUA
    // byte perintah dibentuk lewat generateOutputCommand() -- bukan angka ajaib lagi.
    // Ini penting karena hub dengan revisi firmware berbeda paling aman diperlakukan
    // dengan format perintah yang sudah teruji luas (dipakai ribuan Scratch WeDo2 project).
    class WeDo2MotorPort {
        constructor (parentEngine, connectID) {
            this._parent = parentEngine;
            this._connectID = connectID; // 1 atau 2
            this._direction = 1;
            this._power = 0; // sudah diskalakan ke rentang 30-100 (lihat setter power)
            this._lastSignedSpeed = null; // untuk hindari kirim ulang perintah yang sama persis
        }

        set direction (value) {
            this._direction = value < 0 ? -1 : 1;
        }

        // value: kecepatan diminta 0-100 (magnitude). Formula IDENTIK dengan
        // WeDo2Motor.power resmi: WeDo 2.0 hub cuma respons di rentang 30-100,
        // jadi 0-100 dari UI dipetakan ulang ke 30-100 (0 tetap 0 = motor mati).
        set power (value) {
            const p = Math.max(0, Math.min(value, 100));
            if (p === 0) {
                this._power = 0;
            } else {
                const delta = 100 / p;
                this._power = 30 + (70 / delta);
            }
        }

        turnOn () {
            if (this._power === 0) return;
            const cmd = this._parent.generateOutputCommand(
                this._connectID,
                WeDo2Command.MOTOR_POWER,
                [Math.round(this._power) * this._direction]
            );
            this._parent.send(BLECharacteristic.OUTPUT_COMMAND, cmd);
        }

        turnOff () {
            const cmd = this._parent.generateOutputCommand(
                this._connectID,
                WeDo2Command.MOTOR_POWER,
                [0]
            );
            this._parent.send(BLECharacteristic.OUTPUT_COMMAND, cmd);
        }

        // Dipanggil dari setMotor() global -- signedSpeed: -100..100 (tanda = arah)
        setPower (signedSpeed) {
            if (this._lastSignedSpeed === signedSpeed) return;
            this._lastSignedSpeed = signedSpeed;

            if (signedSpeed === 0) {
                this.turnOff();
                return;
            }
            this.direction = signedSpeed < 0 ? -1 : 1;
            this.power = Math.abs(signedSpeed);
            this.turnOn();
        }

        // Dipanggil saat mission stop/hub disconnect, supaya lain kali start lagi
        // dengan kecepatan yang SAMA tetap terkirim (bukan disangka "tidak berubah").
        resetState () {
            this._lastSignedSpeed = null;
        }
    }

    class NativeWeDo2Engine {
        constructor (hubIndex) {
            this.hubIndex = hubIndex;
            this.id = 'hub_' + hubIndex;
            this.name = 'WeDo Hub ' + (hubIndex + 1);
            this._ports = ['none', 'none'];
            this._motors = [null, null];
            this.sensorValues = { 1: 0, 2: 0 };
            this.bleDevice = null;
            this.bleServer = null;
            this.chars = {};
            this.isReady = false;
            this._lastTiltLogged = { 1: undefined, 2: undefined };
            // Antrean supaya writeValue() ke hub ini SELALU berurutan -- BLE tidak
            // izinkan 2 operasi GATT overlap; overlap adalah penyebab paling umum
            // error "GATT operation failed" / NotSupportedError.
            this._writeQueue = Promise.resolve();
            this._rateLimiter = new RateLimiter(BLESendRateMax);
            this._rateLimitWarned = false;
            this.runner = new ProgramRunner(this.id, this);

            AppState.robots.push({
                id: this.id,
                name: this.name,
                hub1: this.id,
                portMap: { 1: 0, 2: 0 },
                sensorValues: this.sensorValues,
                isReady: false,
                isRunning: false
            });
        }

        async connect () {
            logMessage('Memindai Hub WeDo 2.0...');
            this.bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [BLEService.DEVICE_SERVICE] }],
                optionalServices: [BLEService.IO_SERVICE, 'battery_service', '0000180a-0000-1000-8000-00805f9b34fb']
            });

            this.bleDevice.addEventListener('gattserverdisconnected', () => {
                logMessage('Hub ' + (this.hubIndex + 1) + ' terputus.', 'error');
                this.runner.stop();
                const card = document.getElementById('hubCard-' + this.hubIndex);
                if (card) card.remove();
                AppState.robots = AppState.robots.filter(r => r.id !== this.id);
                refreshEmptyState();
                renderMissionUI();
                refreshStatusDots();
                this.bleServer = null;
            });

            this.bleServer = await this.bleDevice.gatt.connect();
            const hubService = await this.bleServer.getPrimaryService(BLEService.DEVICE_SERVICE);
            let ioService;
            try {
                ioService = await this.bleServer.getPrimaryService(BLEService.IO_SERVICE);
            } catch (e) {
                ioService = hubService;
            }

            this.chars.attachedIo = await hubService.getCharacteristic(BLECharacteristic.ATTACHED_IO);
            this.chars.inputCommand = await ioService.getCharacteristic(BLECharacteristic.INPUT_COMMAND);
            this.chars.outputCommand = await ioService.getCharacteristic(BLECharacteristic.OUTPUT_COMMAND);
            this.chars.inputValues = await ioService.getCharacteristic(BLECharacteristic.INPUT_VALUES);

            try {
                this.chars.button = await hubService.getCharacteristic(BLECharacteristic.BUTTON_STATE);
                await this.chars.button.startNotifications();
                this.chars.button.addEventListener('characteristicvaluechanged', (e) => {
                    if (e.target.value.getUint8(0) === 1) {
                        logMessage('[FISIK] Tombol Hub ' + (this.hubIndex + 1) + ' ditekan!', 'packet');
                        if (this.runner.isRunning) {
                            this.runner.stop();
                        } else {
                            this.runner.start();
                        }
                    }
                });
            } catch (e) {
                logMessage('Hub ' + (this.hubIndex + 1) + ' tidak mendukung tombol fisik.', 'warn');
            }

            await this.chars.attachedIo.startNotifications();
            this.chars.attachedIo.addEventListener('characteristicvaluechanged', (e) => this._onMessage(e.target.value));

            await this.chars.inputValues.startNotifications();
            this.chars.inputValues.addEventListener('characteristicvaluechanged', (e) => this._onMessage(e.target.value));

            setStatus(this.hubIndex, 'Terhubung & Aktif', 'ok');
            const nameEl = document.getElementById('hubName-' + this.hubIndex);
            if (nameEl) nameEl.innerText = this.bleDevice.name || ('WeDo Hub ' + (this.hubIndex + 1));
            logMessage('Berhasil terhubung penuh ke: ' + (this.bleDevice.name || 'WeDo Hub'), 'packet');

            this.setLEDMode();
            this.setRGB(9, 132, 227);
            renderMissionUI();
            refreshStatusDots();
        }

        // ================== GENERATOR PERINTAH -- PERSIS DARI SOURCE RESMI ==================
        // Diambil apa adanya dari scratch-vm wedo2.js (generateOutputCommand /
        // generateInputCommand). SEMUA perintah BLE (motor, LED, format sensor)
        // WAJIB lewat dua fungsi ini -- tidak ada lagi array byte ad-hoc di tempat lain.
        generateOutputCommand (connectID, commandID, values = null) {
            let command = [connectID, commandID];
            if (values) {
                command = command.concat(values.length).concat(values);
            }
            return command;
        }

        generateInputCommand (connectID, type, mode, delta, units, enableNotifications) {
            return [
                1, // Command ID = 1 = "Sensor Format"
                2, // Command Type = 2 = "Write"
                connectID,
                type,
                mode,
                delta,
                0, // Delta Interval Byte 2
                0, // Delta Interval Byte 3
                0, // Delta Interval Byte 4
                units,
                enableNotifications ? 1 : 0
            ];
        }

        setRGB (r, g, b) {
            const cmd = this.generateOutputCommand(WeDo2ConnectID.LED, WeDo2Command.WRITE_RGB, [r, g, b]);
            this.send(BLECharacteristic.OUTPUT_COMMAND, cmd);
        }

        setLEDMode () {
            const cmd = this.generateInputCommand(WeDo2ConnectID.LED, WeDo2Device.LED, WeDo2Mode.LED, 0, WeDo2Unit.LED, false);
            this.send(BLECharacteristic.INPUT_COMMAND, cmd);
        }

        send (uuid, message) {
            if (!this.bleServer) return Promise.resolve();

            if (!this._rateLimiter.okayToSend()) {
                // Persis perilaku resmi: kalau melebihi BLESendRateMax/detik, perintah
                // ini DILEWATI (bukan diantre menumpuk) supaya hub tidak kebanjiran.
                if (!this._rateLimitWarned) {
                    logMessage('Hub ' + (this.hubIndex + 1) + ': laju perintah dibatasi (>' + BLESendRateMax + '/detik), sebagian perintah dilewati sementara.', 'warn');
                    this._rateLimitWarned = true;
                }
                return Promise.resolve();
            }
            this._rateLimitWarned = false;

            const dataArray = new Uint8Array(message);
            const doWrite = () => {
                if (uuid === BLECharacteristic.INPUT_COMMAND && this.chars.inputCommand) {
                    return this.chars.inputCommand.writeValue(dataArray);
                } else if (uuid === BLECharacteristic.OUTPUT_COMMAND && this.chars.outputCommand) {
                    return this.chars.outputCommand.writeValue(dataArray);
                }
                return Promise.resolve();
            };
            // Rantai ke antrean yang sama: writeValue baru BARU dikirim setelah
            // writeValue sebelumnya benar-benar selesai (berhasil ATAU gagal).
            // Ini mencegah 2 operasi GATT berjalan bersamaan di hub yang sama.
            const next = this._writeQueue.then(doWrite, doWrite).catch(err => {
                logMessage('Hub ' + (this.hubIndex + 1) + ': perintah BLE gagal (' + (err && err.message ? err.message : err) + ')', 'warn');
            });
            this._writeQueue = next;
            return next;
        }

        _onMessage (dataView) {
            const data = new Uint8Array(dataView.buffer);
            if (data.length >= 4 && (data[0] === 1 || data[0] === 2)) {
                const connectID = data[0];
                if (data[1] === 0) {
                    this._clearPort(connectID); // sudah renderMissionUI() sendiri di dalamnya
                } else {
                    this._registerSensorOrMotor(connectID, data[3]); // sudah renderMissionUI() sendiri di dalamnya
                }
                return;
            }

            // Update NILAI sensor biasa -- JANGAN render ulang mission builder di sini.
            // Dulu renderMissionUI() (rebuild HTML dropdown lengkap) dipanggil di SETIAP
            // notifikasi, termasuk update angka sensor yang bisa masuk puluhan kali/detik.
            // Itu bikin main thread sibuk, writeValue() jadi telat terkirim/dibalas, dan
            // pada sebagian hub clone memicu firmware-nya beep terus sebagai indikasi
            // komunikasi tidak lancar. Update nilai cukup langsung ke elemen DOM span-nya.
            const connectID = data[1];
            const type = this._ports[connectID - 1];
            const valEl = document.getElementById('port' + connectID + 'Val-' + this.hubIndex);

            if (type === WeDo2Device.DISTANCE) {
                const rawDist = data[2];
                if (rawDist > DistanceConfig.maxRaw && !this._distanceCalibWarned) {
                    logMessage('Hub ' + (this.hubIndex + 1) + ' Port ' + connectID +
                        ': nilai jarak mentah (' + rawDist + ') melebihi DistanceConfig.maxRaw (' + DistanceConfig.maxRaw +
                        '). Pertimbangkan naikkan DistanceConfig.maxRaw supaya threshold dropdown tetap akurat.', 'warn');
                    this._distanceCalibWarned = true;
                }
                this.sensorValues[connectID] = rawDist;
                if (valEl) valEl.innerText = rawDist;
            } else if (type === WeDo2Device.TILT) {
                const rawX = data[2];
                // Fallback aman 0 (netral) kalau hub cuma kirim 1 byte, BUKAN 128 seperti versi lama
                // (128 di skema unwrap-signed berarti sudut ~ -128, jauh dari netral -> salah).
                const rawY = data.length > 3 ? data[3] : 0;
                const filteredTilt = snapTiltValue(rawX, rawY);

                // Log kalibrasi: hanya saat nilai BERUBAH, supaya tidak membanjiri log,
                // tapi cukup untuk verifikasi arah fisik saat tes hardware.
                if (this._lastTiltLogged[connectID] !== filteredTilt) {
                    const angleX = unwrapSignedByte(rawX);
                    const angleY = unwrapSignedByte(rawY);
                    logMessage('Hub ' + (this.hubIndex + 1) + ' Port ' + connectID +
                        ' Tilt raw(' + rawX + ',' + rawY + ') sudut(' + angleX + '°,' + angleY + '°) → kode ' + filteredTilt, 'packet');
                    this._lastTiltLogged[connectID] = filteredTilt;
                }

                this.sensorValues[connectID] = filteredTilt;
                if (valEl) valEl.innerText = filteredTilt;
            }
        }

        _registerSensorOrMotor (connectID, type) {
            this._ports[connectID - 1] = type;
            this._motorWarnLogged = false;
            let typeName = 'TypeID (' + type + ')';
            const robotObj = AppState.robots.find(r => r.id === this.id);
            if (robotObj) robotObj.portMap[connectID] = type;

            if (type === WeDo2Device.MOTOR) {
                typeName = 'DC Motor';
                this._motors[connectID - 1] = new WeDo2MotorPort(this, connectID);
            } else if (type === WeDo2Device.DISTANCE) {
                typeName = 'Distance';
                const cmd = this.generateInputCommand(connectID, type, WeDo2Mode.DISTANCE, 1, WeDo2Unit.DISTANCE, true);
                this.send(BLECharacteristic.INPUT_COMMAND, cmd);
            } else if (type === WeDo2Device.TILT) {
                typeName = 'Tilt';
                const cmd = this.generateInputCommand(connectID, type, WeDo2Mode.TILT, 1, WeDo2Unit.TILT, true);
                this.send(BLECharacteristic.INPUT_COMMAND, cmd);
            }

            const typeEl = document.getElementById('port' + connectID + 'Type-' + this.hubIndex);
            if (typeEl) typeEl.innerText = typeName;
            renderMissionUI();
        }

        _clearPort (connectID) {
            this._ports[connectID - 1] = 'none';
            this._motors[connectID - 1] = null;
            const robotObj = AppState.robots.find(r => r.id === this.id);
            if (robotObj) robotObj.portMap[connectID] = 0;
            const typeEl = document.getElementById('port' + connectID + 'Type-' + this.hubIndex);
            if (typeEl) typeEl.innerText = 'Kosong';
            renderMissionUI();
        }
    }

    const engines = [];

    window.setMotor = function(hubId, portNum, speed) {
        const eng = engines.find(e => e && e.id === hubId);
        if (!eng) return;
        if (eng._motors[portNum - 1]) {
            eng._motors[portNum - 1].setPower(speed);
        } else if (speed !== 0 && !eng._motorWarnLogged) {
            // Dulu gagal diam-diam tanpa jejak apa pun -- sekarang dilaporkan sekali
            // supaya kelihatan kalau port yang dipilih di mission builder ternyata
            // BUKAN port yang ada motornya (misal masih default Port A padahal
            // sensor terpasang di situ, motor sebenarnya di Port B).
            logMessage('⚠️ Hub ' + (eng.hubIndex + 1) + ' Port ' + portNum + ': tidak ada motor terdaftar di port ini. Cek lagi pilihan port di langkah misi.', 'warn');
            eng._motorWarnLogged = true;
        }
    };

    window.setRGB = async function(hubId, r, g, b) {
        const eng = engines.find(e => e && e.id === hubId);
        if (eng) eng.setRGB(r, g, b);
    };

    window.setGlobalColor = async function() {
        const colorInput = document.getElementById('global-color');
        if (!colorInput) return;
        var rgb = hexToRgb(colorInput.value);
        for (var i = 0; i < AppState.robots.length; i++) {
            var r = AppState.robots[i];
            await setRGB(r.id, rgb.r, rgb.g, rgb.b);
        }
    };

    window.toggleReady = function(idx) {
        var eng = engines[idx];
        if (!eng) return;
        eng.isReady = !eng.isReady;
        var robotObj = AppState.robots.find(r => r.id === eng.id);
        if (robotObj) robotObj.isReady = eng.isReady;
        var btn = document.getElementById('readyBtn-' + idx);
        if (btn) {
            btn.innerText = eng.isReady ? 'READY 🟢' : 'READY';
            btn.style.background = eng.isReady ? '#00b894' : '#0984e3';
        }
    };

    window.broadcastMission = function() {
        GlobalMission.isExecuting = !GlobalMission.isExecuting;
        engines.forEach(eng => {
            if (eng) {
                if (GlobalMission.isExecuting && eng.isReady) {
                    eng.runner.start();
                } else if (!GlobalMission.isExecuting) {
                    eng.runner.stop();
                }
            }
        });
        renderMissionUI();
        refreshStatusDots();
    };

    window.stopAllMissions = async function() {
        GlobalMission.isExecuting = false;
        engines.forEach(eng => {
            if (eng) eng.runner.stop();
        });
        renderMissionUI();
        refreshStatusDots();
    };

    function directDriveManual(hubIdx, portNum, speed) {
        setMotor('hub_' + hubIdx, portNum, speed);
    }

    function setStatus (idx, text, variant) {
        const el = document.getElementById('statusText-' + idx);
        if (el) {
            el.innerText = text;
            el.className = 'status-badge' + (variant === 'ok' ? ' ok' : '');
        }
    }

    document.getElementById('btnConnect').addEventListener('click', async () => {
        if (engines.filter(e => e).length >= MAX_HUBS) {
            logMessage('Maksimal ' + MAX_HUBS + ' hub sudah terhubung.', 'warn');
            return;
        }

        const emptyState = document.getElementById('emptyState');
        if (emptyState) emptyState.remove();

        const idx = engines.length;
        document.getElementById('hubsContainer').insertAdjacentHTML('beforeend', hubCardHtml(idx));

        const engine = new NativeWeDo2Engine(idx);
        engines.push(engine);

        try {
            await engine.connect();
        } catch (err) {
            logMessage('Koneksi Hub ' + (idx + 1) + ' Gagal: ' + err.message, 'error');
            engines[idx] = null;
            const card = document.getElementById('hubCard-' + idx);
            if (card) card.remove();
            refreshEmptyState();
            refreshStatusDots();
        }
    });

    function disconnectHub (idx) {
        if (engines[idx]) engines[idx].runner.stop();
        const engine = engines[idx];
        if (engine && engine.bleDevice && engine.bleDevice.gatt.connected) {
            engine.bleDevice.gatt.disconnect();
        }
    }

    function refreshEmptyState () {
        const container = document.getElementById('hubsContainer');
        if (container.children.length === 0 && !document.getElementById('emptyState')) {
            container.insertAdjacentHTML('beforeend', '<div class="empty-state" id="emptyState">Belum ada hub. Klik "+ Hubungkan Hub" untuk mulai (maks. 4 hub).</div>');
        }
    }

    function getPortOptions(selected, filterType = null) {
        var ports = [
            { id: 'A', name: 'Port A', num: 1 },
            { id: 'B', name: 'Port B', num: 2 }
        ];

        var html = '';
        for (var i = 0; i < ports.length; i++) {
            var p = ports[i];
            var isDisabled = false;
            var labelSuffix = '';

            if (filterType === 'sensor') {
                var sType = getAutoSensorType(p.id);
                if (sType === 'motor' || sType === 'none') {
                    isDisabled = true;
                    labelSuffix = ' (Bukan Sensor)';
                } else {
                    labelSuffix = ' (' + sType.toUpperCase() + ')';
                }
            } else if (filterType === 'motor') {
                var sType = getAutoSensorType(p.id);
                if (sType === 'distance' || sType === 'tilt') {
                    isDisabled = true;
                    labelSuffix = ' (Terpasang Sensor)';
                } else {
                    labelSuffix = ' (Motor/Kosong)';
                }
            }

            html += '<option value="' + p.id + '" ' + (selected === p.id ? 'selected' : '') + (isDisabled ? ' disabled style="color:#b2bec3;"' : '') + '>' + p.name + labelSuffix + '</option>';
        }
        return html;
    }

    function getIrSelectorOptions(sel) {
        var opts = '';
        for (var i = 0; i <= DistanceConfig.maxRaw; i += DistanceConfig.step) {
            opts += '<option value="' + i + '" ' + (sel === i ? 'selected' : '') + '>Jarak: ' + i + '</option>';
        }
        return opts;
    }

    function getTiltSelectorOptions(sel) {
        var tiltVals = [
            { val: 0, label: '0 - Datar (Netral)' },
            { val: 3, label: '3 - Miring Belakang' },
            { val: 5, label: '5 - Miring Depan' },
            { val: 7, label: '7 - Miring Kanan' },
            { val: 9, label: '9 - Miring Kiri' }
        ];
        var opts = '';
        for (var i = 0; i < tiltVals.length; i++) {
            opts += '<option value="' + tiltVals[i].val + '" ' + (sel === tiltVals[i].val ? 'selected' : '') + '>' + tiltVals[i].label + '</option>';
        }
        return opts;
    }

    window.getAutoSensorType = function(portChar) {
        var pNum = (portChar === 'A' || portChar === 'C') ? 1 : 2;
        var entities = getPlayableEntities();
        for (var i = 0; i < entities.length; i++) {
            var ent = entities[i];
            var hId = ent.hub1;
            if (hId) {
                var r = AppState.robots.find(function(x) { return x.id === hId; });
                if (r && r.portMap && r.portMap[pNum]) {
                    var typeId = r.portMap[pNum];
                    if (typeId === WeDo2Device.TILT) return 'tilt';
                    if (typeId === WeDo2Device.DISTANCE) return 'distance';
                    if (typeId === WeDo2Device.MOTOR) return 'motor';
                }
            }
        }
        return 'none';
    };

    function resolveHardwarePort(ent, portChar) {
        var physPort = (portChar === 'A') ? 1 : 2;
        return { hubId: ent.hub1, port: physPort };
    }

    // Remote sekarang mengarah ke SATU robot terpilih (bukan broadcast ke semua hub
    // sekaligus) -- penting begitu ada >1 hub aktif supaya remote tidak menggerakkan
    // semua robot bersamaan tanpa sengaja.
    window.sendTankCommand = async function(side, direction, speed) {
        var sel = document.getElementById('remote-target');
        if (!sel || !sel.value) return alert("Pilih robot target dulu di dropdown remote!");
        var ent = getPlayableEntities().find(e => e.id === sel.value);
        if (!ent) return;
        var targetPortChar = (side === 'left') ? 'A' : 'B';
        var hw = resolveHardwarePort(ent, targetPortChar);
        if (hw.hubId) {
            setMotor(hw.hubId, hw.port, speed * direction);
        }
    };

    window.ProgramRunner = function(entityId, engineInstance) {
        var self = this;
        this.entityId = entityId;
        this.engineInstance = engineInstance;
        this.isRunning = false;
        this.stateIndex = 1;
        this.currentActions = [];
        this.logicLock = false;
        this.timer = null;
        this.keepAliveTimer = null;

        this.start = function() {
            if (this.isRunning) return;
            this.isRunning = true;
            this.stateIndex = 1;

            var txt = document.getElementById('status-' + this.entityId);
            if (txt) { txt.innerText = "RUNNING"; txt.className = 'status-badge running'; }

            var stateInd = document.getElementById('stateIndicator-' + this.entityId);
            if (stateInd && GlobalMission.type === 'm5') {
                stateInd.style.display = 'block';
                stateInd.innerText = '📍 STATE AKTIF: [ 1 ]';
            }

            refreshStatusDots();

            if (GlobalMission.type === 'remote') return;

            this.keepAliveTimer = setInterval(() => {
                if (!this.isRunning) return;
                var ent = getPlayableEntities().find(e => e.id === this.entityId);
                if (!ent) return;
                for (var i = 0; i < this.currentActions.length; i++) {
                    var act = this.currentActions[i];
                    var hw = resolveHardwarePort(ent, act.port);
                    if (hw.hubId) {
                        setMotor(hw.hubId, hw.port, act.speed * act.direction);
                    }
                }
            }, 200);

            this.timer = setInterval(() => {
                if (!this.isRunning || this.logicLock) return;
                this.runLocal();
            }, 100);
        };

        this.stop = function() {
            this.isRunning = false;
            clearInterval(this.timer);
            clearInterval(this.keepAliveTimer);
            this.currentActions = [];

            if (this.engineInstance) {
                this.engineInstance._motors.forEach(m => { if (m) m.resetState(); });
            }

            var ent = getPlayableEntities().find(e => e.id === this.entityId);
            if (ent) {
                ['A', 'B'].forEach(p => {
                    var hw = resolveHardwarePort(ent, p);
                    if (hw.hubId) setMotor(hw.hubId, hw.port, 0);
                });
            }
            var txt = document.getElementById('status-' + this.entityId);
            if (txt) { txt.innerText = "IDLE"; txt.className = 'status-badge'; }

            var stateInd = document.getElementById('stateIndicator-' + this.entityId);
            if (stateInd) stateInd.style.display = 'none';

            refreshStatusDots();
        };

        this.runLocal = async function() {
            var ent = getPlayableEntities().find(e => e.id === this.entityId);
            if (!ent) return;

            if (GlobalMission.type === 'm1') {
                this.currentActions = GlobalMission.m1Row.actions;
            }
            else if (GlobalMission.type === 'm2') {
                var row2 = GlobalMission.m2Rows[this.stateIndex - 1];
                if (!row2) {
                    if (GlobalMission.m2Loop) {
                        this.stateIndex = 1;
                        return;
                    } else {
                        this.stop();
                        return;
                    }
                }
                this.logicLock = true;
                this.currentActions = row2.actions;

                await new Promise(r => setTimeout(r, row2.time * 1000));
                if (this.isRunning) {
                    this.stateIndex++;
                    this.logicLock = false;
                    if (this.stateIndex > GlobalMission.m2Rows.length) {
                        if (GlobalMission.m2Loop) {
                            this.stateIndex = 1;
                        } else {
                            this.stop();
                        }
                    }
                }
            }
            else if (GlobalMission.type === 'm3') {
                var triggered = false;
                for (var i = 0; i < GlobalMission.m3Rows.length; i++) {
                    var r3 = GlobalMission.m3Rows[i];
                    var hw3 = resolveHardwarePort(ent, r3.sensorPort);
                    var val = getSensorVal(hw3.hubId, r3.sensorPort, r3.sensorType);

                    var match = false;
                    if (r3.operator === '<') match = (val < r3.threshold);
                    else if (r3.operator === '==') match = (Math.round(val) === r3.threshold);
                    else if (r3.operator === '>') match = (val > r3.threshold);

                    if (match) {
                        triggered = true;
                        this.logicLock = true;
                        for (var s = 0; s < r3.steps.length; s++) {
                            var step = r3.steps[s];
                            this.currentActions = step.actions;
                            await new Promise(res => setTimeout(res, step.time * 1000));
                            if (!this.isRunning) return;
                        }
                        this.logicLock = false;
                        break;
                    }
                }
                if (!triggered) {
                    this.currentActions = GlobalMission.defaultActions;
                }
            }
            else if (GlobalMission.type === 'm4') {
                for (var i2 = 0; i2 < GlobalMission.m4Rows.length; i2++) {
                    var r4 = GlobalMission.m4Rows[i2];
                    var hw4 = resolveHardwarePort(ent, r4.sensorPort);
                    var val4 = getSensorVal(hw4.hubId, r4.sensorPort, r4.sensorType);

                    var match4 = false;
                    if (r4.operator === '<') match4 = (val4 < r4.threshold);
                    else if (r4.operator === '==') match4 = (Math.round(val4) === r4.threshold);
                    else if (r4.operator === '>') match4 = (val4 > r4.threshold);

                    if (match4) {
                        this.currentActions = r4.actions;
                    }
                }
            }
            else if (GlobalMission.type === 'm5') {
                var hw5 = resolveHardwarePort(ent, GlobalMission.m5TriggerPort);
                var val5 = getSensorVal(hw5.hubId, GlobalMission.m5TriggerPort, GlobalMission.m5SensorType);

                var m5Match = false;
                if (GlobalMission.m5Operator === '<') m5Match = (val5 < GlobalMission.m5TriggerVal);
                else if (GlobalMission.m5Operator === '==') m5Match = (Math.round(val5) === GlobalMission.m5TriggerVal);
                else if (GlobalMission.m5Operator === '>') m5Match = (val5 > GlobalMission.m5TriggerVal);

                if (m5Match && !this.logicLock) {
                    this.logicLock = true;
                    this.stateIndex++;
                    if (this.stateIndex > GlobalMission.states.length) this.stateIndex = 1;

                    var stateInd = document.getElementById('stateIndicator-' + this.entityId);
                    if (stateInd) {
                        stateInd.style.display = 'block';
                        stateInd.innerText = '📍 STATE AKTIF: [ ' + this.stateIndex + ' ]';
                    }

                    setTimeout(() => { this.logicLock = false; }, 800);
                }
                var activeState = GlobalMission.states[this.stateIndex - 1];
                if (activeState) this.currentActions = activeState.actions;
            }
        };
    };

    // ================== HELPER MUTASI DATA MISI (per-mode, tidak saling tabrakan) ==================
    window.addGlobalRow = function() {
        if (GlobalMission.type === 'm2') {
            GlobalMission.m2Rows.push({ time: 2, actions: [{ port: 'A', direction: 1, speed: 100 }] });
        } else if (GlobalMission.type === 'm3') {
            GlobalMission.m3Rows.push({ sensorPort: 'A', sensorType: 'distance', operator: '<', threshold: 5, steps: [{ time: 2, actions: [{ port: 'A', direction: 1, speed: 100 }] }] });
        } else if (GlobalMission.type === 'm4') {
            GlobalMission.m4Rows.push({ sensorPort: 'A', sensorType: 'tilt', operator: '==', threshold: 0, actions: [{ port: 'A', direction: 1, speed: 100 }] });
        }
        refreshGlobalRows();
    };

    window.removeGlobalRow = function(idx) {
        if (GlobalMission.type === 'm2') GlobalMission.m2Rows.splice(idx, 1);
        else if (GlobalMission.type === 'm3') GlobalMission.m3Rows.splice(idx, 1);
        else if (GlobalMission.type === 'm4') GlobalMission.m4Rows.splice(idx, 1);
        refreshGlobalRows();
    };

    window.addActionToRow = function(rowIdx) {
        if (GlobalMission.type === 'm1') GlobalMission.m1Row.actions.push({ port: 'B', direction: 1, speed: 100 });
        else if (GlobalMission.type === 'm2') GlobalMission.m2Rows[rowIdx].actions.push({ port: 'B', direction: 1, speed: 100 });
        else if (GlobalMission.type === 'm4') GlobalMission.m4Rows[rowIdx].actions.push({ port: 'B', direction: 1, speed: 100 });
        refreshGlobalRows();
    };

    window.removeActionFromRow = function(rowIdx, actIdx) {
        if (GlobalMission.type === 'm1') GlobalMission.m1Row.actions.splice(actIdx, 1);
        else if (GlobalMission.type === 'm2') GlobalMission.m2Rows[rowIdx].actions.splice(actIdx, 1);
        else if (GlobalMission.type === 'm4') GlobalMission.m4Rows[rowIdx].actions.splice(actIdx, 1);
        refreshGlobalRows();
    };

    window.addDefaultAction = function() { GlobalMission.defaultActions.push({ port: 'B', direction: 1, speed: 100 }); refreshGlobalRows(); };
    window.removeDefaultAction = function(idx) { GlobalMission.defaultActions.splice(idx, 1); refreshGlobalRows(); };
    window.addStepToRow = function(rowIdx) { GlobalMission.m3Rows[rowIdx].steps.push({ time: 2, actions: [{ port: 'A', direction: 1, speed: 100 }] }); refreshGlobalRows(); };
    window.removeStepFromRow = function(rowIdx, stepIdx) { GlobalMission.m3Rows[rowIdx].steps.splice(stepIdx, 1); refreshGlobalRows(); };
    window.addActionToStep = function(rowIdx, stepIdx) { GlobalMission.m3Rows[rowIdx].steps[stepIdx].actions.push({ port: 'B', direction: 1, speed: 100 }); refreshGlobalRows(); };
    window.removeActionFromStep = function(rowIdx, stepIdx, actIdx) { GlobalMission.m3Rows[rowIdx].steps[stepIdx].actions.splice(actIdx, 1); refreshGlobalRows(); };
    window.addState = function() { GlobalMission.states.push({ actions: [{ port: 'A', direction: 1, speed: 100 }] }); refreshGlobalRows(); };
    window.removeState = function(idx) { GlobalMission.states.splice(idx, 1); refreshGlobalRows(); };
    window.addActionToState = function(stateIdx) { GlobalMission.states[stateIdx].actions.push({ port: 'B', direction: 1, speed: 100 }); refreshGlobalRows(); };
    window.removeActionFromState = function(stateIdx, actIdx) { GlobalMission.states[stateIdx].actions.splice(actIdx, 1); refreshGlobalRows(); };

    window.updateActionVal = function(type, rIdx, aIdx, key, val, stepIdx) {
        if (type === 'm1') { GlobalMission.m1Row.actions[aIdx][key] = val; }
        else if (type === 'normal' || type === 'm2_time') {
            if (key === 'time') GlobalMission.m2Rows[rIdx].time = val;
            else GlobalMission.m2Rows[rIdx].actions[aIdx][key] = val;
        } else if (type === 'm3_def') { GlobalMission.defaultActions[aIdx][key] = val; }
        else if (type === 'm3_seq') { GlobalMission.m3Rows[rIdx].steps[stepIdx].actions[aIdx][key] = val; }
        else if (type === 'm3_time') { GlobalMission.m3Rows[rIdx].steps[stepIdx].time = val; }
        else if (type === 'm4_act') { GlobalMission.m4Rows[rIdx].actions[aIdx][key] = val; }
        else if (type === 'm5') { GlobalMission.states[rIdx].actions[aIdx][key] = val; }
    };

    function logMessage (msg, type = 'info') {
        const box = document.getElementById('systemLog');
        let color = '#00cec9';
        if (type === 'warn') color = '#fdcb6e';
        if (type === 'error') color = '#ff7675';
        if (type === 'packet') color = '#00b894';
        box.innerHTML += '<br><span style="color:' + color + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</span>';
        box.scrollTop = box.scrollHeight;
    }

    function clearLogs () { document.getElementById('systemLog').innerHTML = '[SYSTEM] Log dibersihkan.'; }
    function copyLogs () {
        const box = document.getElementById('systemLog');
        navigator.clipboard.writeText(box.innerText || box.textContent).then(() => logMessage('Log disalin!', 'packet'));
    }

    renderMissionUI();
    refreshStatusDots();
</script>
</body>
</html>
